# パイプラインの動作設定（コードを変更せずここで調整）

collection:
  # X API の検索クエリ（任意）。lang:ja で日本語、-is:retweet でRT除外。
  # 既定は「税金・お金」に特化。炎上ネタは法的リスクが高いため既定では扱わない。
  # ※ X API は有料。API を使わず drafts コマンド（topics JSON）で運用するのが基本。
  queries:
    tax:   '(増税 OR 減税 OR 税金 OR 確定申告 OR インボイス OR 控除) lang:ja -is:retweet'
    money: '(新NISA OR iDeCo OR 節税 OR 手取り OR 社会保険料 OR 資産運用) lang:ja -is:retweet'
  max_results_per_query: 25   # X API の recent search は 10-100
  min_likes: 100              # ノイズ除去のための最低いいね数
  min_retweets: 20

classification:
  # トピック判定と話題度スコアの重み
  weights:
    likes: 0.3
    retweets: 0.5
    replies: 0.2
  # スコアがこの値以上のものだけを採用
  score_threshold: 200

safety:
  # 個人名を名指ししたコンテンツをブロック（誤情報・名誉毀損リスク回避）
  block_personal_targeting: true
  # 未確認の断定表現を検出したら警告フラグを付与
  flag_unverified_claims: true
  # 収集元として信頼するアカウント種別（優先）
  prefer_verified_sources: true

video:
  width: 1080
  height: 1920        # 縦型 9:16 (TikTok)
  max_duration_sec: 55
  slides_per_video: 5
  background_color: '#0f172a'
  text_color: '#f8fafc'
  accent_color: '#38bdf8'
  sub_color: '#94a3b8'
  tts_lang: 'ja'
  handle: ''                    # 例: '@your_handle'（動画下部に表示）
  footer_note: '※投資は自己責任・税制は要確認'

publishing:
  # 投稿時のプライバシー。未審査アプリは SELF_ONLY のみ許可される。
  privacy_level: 'SELF_ONLY'   # SELF_ONLY | MUTUAL_FOLLOW_FRIENDS | PUBLIC_TO_EVERYONE
  disable_comment: false
  disable_duet: false
  disable_stitch: false
  # ハッシュタグ（動画説明に付与）
  hashtags: ['#お金の勉強', '#節税', '#会社員']
  # drafts コマンド用: カテゴリ別ハッシュタグ
  hashtags_by_category:
    money: ['#お金', '#節税', '#会社員', '#iDeCo', '#新NISA', '#お金の勉強']
    tax:   ['#税金', '#確定申告', '#副業', '#節税', '#会社員', '#お金の勉強']
    nisa:  ['#新NISA', '#投資', '#資産運用', '#お金の勉強', '#会社員']

# アフィリエイト導線（概要欄に自動挿入）。
# ※ 日本のステマ規制対応: 紹介リンクがある動画は必ず「#PR」等の表記が必要。
#    label / url を自分のアフィリリンクに置き換えて使う。空なら挿入されない。
affiliate:
  disclosure: 'この概要には広告(アフィリエイトリンク)が含まれます #PR'
  links:
    - label: '【証券口座】新NISAを始めるなら'
      url: ''      # 例: 楽天証券/SBI証券のアフィリリンク
    - label: '【ふるさと納税】実質2000円で返礼品'
      url: ''
    - label: '【書籍】お金の基本が学べる一冊'
      url: ''
