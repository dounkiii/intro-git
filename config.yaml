# パイプラインの動作設定（コードを変更せずここで調整）
#
# ニッチ選定の根拠は docs/PLAYBOOK.md の「3. ニッチ選定」を参照。
# 収益設計の要点: アフィリエイト・ファースト（プラットフォーム収益は後乗り）。

collection:
  # X API の検索クエリ。lang:ja で日本語、-is:retweet でRT除外。
  # お金・税金・制度に絞る（高単価アフィリが存在し、ネタが制度改正で自動供給される）。
  queries:
    tax:              '(確定申告 OR インボイス OR 消費税 OR 所得税 OR 年末調整) lang:ja -is:retweet'
    subsidy:          '(補助金 OR 給付金 OR 助成金 OR 支援金) lang:ja -is:retweet'
    social_insurance: '(年金 OR 社会保険 OR 扶養 OR 健康保険料) lang:ja -is:retweet'
    household:        '(ふるさと納税 OR NISA OR 節税 OR 家計) lang:ja -is:retweet'
  max_results_per_query: 25   # X API の recent search は 10-100
  min_likes: 100              # ノイズ除去のための最低いいね数
  min_retweets: 20

classification:
  # トピック判定と話題度スコアの重み
  weights:
    likes: 0.3
    retweets: 0.5
    replies: 0.2
  # スコアがこの値以上のものだけを採用
  score_threshold: 200

safety:
  # 個人名を名指ししたコンテンツをブロック（誤情報・名誉毀損リスク回避）
  block_personal_targeting: true
  # 未確認の断定表現を検出したら警告フラグを付与
  flag_unverified_claims: true
  # 収集元として信頼するアカウント種別（優先）
  prefer_verified_sources: true

scout:
  # === 探索レイヤ（リサーチ → 評価 → 収益化案）===
  # 目的は「面白いニュース探し」ではなく「需要が生まれ始めているのに供給が薄い市場」の
  # 早期発見。順位付けは合計点ではなく early_signal（成長性×競合の少なさ）で行う。
  label: 'scout-report'
  discover_limit: 12      # 発掘元ごとに拾う件数
  research_limit: 3       # 裏取りまで進める件数。無料枠の消費に直結する
  top_n: 3                # レポートに詳細表示する件数
  dedup_similarity: 0.6   # 過去ネタとの Jaccard 係数の閾値
  max_searches_per_candidate: 6
  web_search_tool_type: 'web_search_20260209'   # モデルが古い場合は web_search_20250305

  # 需要の兆候を拾うクエリ。人気ランキングではなく「まだ供給が無い」signal を狙う。
  discovery_queries:
    needs:    '("欲しい" OR "誰か作って" OR "ないのかな") (ツール OR サービス OR アプリ) lang:ja -is:retweet'
    pains:    '("困ってる" OR "面倒すぎる" OR "手作業で") lang:ja -is:retweet'
    new_tool: '(使ってみた OR 試した) (AI OR 新サービス) lang:ja -is:retweet'
    money:    '(副業 OR 節税 OR 補助金 OR 給付金) (始めた OR 変わる OR 締切) lang:ja -is:retweet'
  min_likes: 30
  max_results_per_query: 25

  # 競合の少なさをどう測るか。heuristic は Claude の web_search 結果をドメイン種別に
  # 分類する無料の代理指標（confidence を低く固定してある）。
  # 初売上が出たら有料 SERP API に差し替える想定。
  serp_provider: 'heuristic'   # heuristic | dataforseo | serpapi（後者2つは未実装）

  # 探索予算。収益実績への加点をやめた代わりに、調査枠を分けて
  # 「勝っている市場ばかり再発見する」ループを防ぐ。
  explore_ratio: 0.2           # 採用済みニッチと無関係な候補に回す枠の割合

  thresholds:
    min_likes_per_hour: 5     # これ未満は「伸び始めている」と認めない
    stale_after_seen: 4       # これ以上観測されて伸びなければ陳腐化とみなす
    now_score: 70             # 「今すぐ狙う」の素点しきい値（100点満点は変えない）
    drop_score: 45            # これ未満は「捨てる」
    now_opportunity: 30       # 「今すぐ狙う」に必要な opportunity スコア
    drop_opportunity: 10      # これ未満は「捨てる」
    # confidence は順位には掛けない（早いトレンドほど根拠が薄く、掛けると成熟した
    # ネタを好むシステムになるため）。`now` 判定のゲートとしてのみ使う。
    now_confidence: 0.45

  # 投資レベルの昇格条件（src/scout/commitment.py）。すべて仮値。
  # 「売れた」と「再現性がある」を分けるための歯止め。1件の売上で生成枠を
  # 増やすと初回の成功シグナルに過剰反応するため、どちらかを満たすまで SCALE にしない。
  scale_gate:
    min_conversions: 2        # CV がこの件数以上
    min_revenue_events: 2     # または売上が増えたことをこの回数以上観測
  # Stage 2〜4（配信は成立しているが原因が未解消）の間、生成枠をここまでに抑える。
  # 悪い導線に対して制作量だけ増やさないための歯止め。
  diagnosing_items_per_run: 1

  # 撤退判定。時間ではなく「十分な試行回数」で判定する。
  # ここに値を書くとプラットフォーム既定（src/scout/funnel.py の PLATFORM_DEFAULTS）を
  # 上書きする。自アカウントの実績が10件溜まると、その中央値がさらに優先される。
  funnel:
    min_posts: null                 # null = プラットフォーム既定を使う
    min_impressions: null
    min_impressions_per_post: null  # Stage1: 下回れば「配信されていない」
    min_engagement_rate: null       # Stage2: 下回れば「見られているが刺さっていない」
    min_ctr: null                   # Stage3: 下回れば「導線が弱い」
    min_conversions: 1              # Stage4: 下回れば「案件が悪い」

  # Grok (xAI) 発掘。X 上の空気を読む部分は他モデルで代替しにくいので残している。
  # Web 検索は Claude の web_search で足りるので Gemini は使わない。
  grok:
    enabled: false           # XAI_API_KEY を入れて true にする
    model: 'grok-4'          # 現行のモデル名は https://docs.x.ai/ で確認して設定する
    base_url: 'https://api.x.ai/v1'
    topics: ['副業', 'AIツール', 'お金・税金', '個人開発']
    # Live Search 等を使う場合はここにリクエストパラメータを足す（コード変更不要）
    extra_body: {}

llm:
  # プロバイダ。無料枠で運用できるのが Gemini だけなので既定にしている。
  # 初売上が出たら claude に戻す想定（アダプタは残してある）。
  # プロバイダは凍結対象ではない（docs/OPERATIONS.md §3 に含まれない）。
  provider: 'gemini'      # gemini | claude
  # モデル名は入れ替わる。404 が出たら API のエラーメッセージが後継を教えてくれるので、
  # そこに書かれた名前をここに入れる（2026-08-23: 2.5-flash が新規利用不可になった）。
  gemini_model: 'gemini-3.6-flash'
  model: 'claude-sonnet-5'           # provider: claude のときに使う
  effort: 'medium'        # low | medium | high | xhigh | max
  max_tokens: 8000
  # 無料枠は分あたりの回数制限が厳しく、間を空けずに投げると1回目から429になる。
  # 1日1回のジョブなので待つ余裕はある。429/503 は待って再試行する。
  min_interval_seconds: 6
  max_retries: 3
  # 断定を避け、出典と免責を必ず付けさせるための方針（システムプロンプトに合成される）
  editorial_policy: |
    - 税務・投資の断定的な助言はしない。「一般的な制度の説明」に留める。
    - 個人・企業を名指しして批判しない。
    - 数値や期限は出典が確認できるものだけ書く。不確かなら「要確認」と明示する。
    - 視聴者の行動が変わる論点を1つに絞る。網羅より1点突破。

monetization:
  # 収益の主軸。プラットフォーム収益は閾値が高いので「後からついてくるボーナス」扱い。
  primary: 'affiliate'
  # ステマ規制（景品表示法, 2023年10月〜）対応。アフィリリンクを含む成果物に必ず付与。
  disclosure: '※本投稿にはアフィリエイトリンクを含みます（PR）'
  # 免責。税務・投資テーマでは必須。
  liability_note: '※一般的な制度の解説です。個別の判断は必ず一次情報および専門家にご確認ください。'
  # プロフィールに置くリンク集約ページ。動画の説明文からはここへ誘導する。
  hub_url_slot: 'AFF_HUB_URL'
  # 自前デジタル商品（note / Tips / BASE）。Phase 3 で使う。
  product_url_slot: 'AFF_PRODUCT_URL'
  # 実リンクはリポジトリに書かず、環境変数（GitHub Secrets）から注入する。
  # slot が空の環境変数を指している案件はスキップされる。
  offers:
    # 探索レイヤで /adopt した新しいニッチは、専用の案件定義を持たない。
    # その場合ここが使われる。これが無いと「換金経路なし」で全件作られなくなる。
    default:
      - slot: 'AFF_ACCOUNTING_SOFT'
        label: '関連ツール'
        cta: '作業を効率化するなら'
    tax:
      - slot: 'AFF_ACCOUNTING_SOFT'
        label: '確定申告ソフト'
        cta: '申告書の作成を自動化するなら'
      - slot: 'AFF_TAX_ADVISOR'
        label: '税理士紹介'
        cta: '判断に迷う論点は専門家に確認するのが安全'
    subsidy:
      - slot: 'AFF_ACCOUNTING_SOFT'
        label: '会計ソフト'
        cta: '申請に必要な帳簿を揃えるなら'
      - slot: 'AFF_TAX_ADVISOR'
        label: '専門家紹介'
        cta: '申請要件の判断に迷うなら'
    social_insurance:
      - slot: 'AFF_INSURANCE'
        label: '保険の無料相談'
        cta: '公的保障で足りない部分を確認するなら'
    household:
      - slot: 'AFF_FURUSATO'
        label: 'ふるさと納税サイト'
        cta: '控除上限のシミュレーションはこちら'
      - slot: 'AFF_SECURITIES'
        label: '証券口座'
        cta: 'NISA枠を使い始めるなら'

video:
  width: 1080
  height: 1920        # 縦型 9:16 (TikTok)
  # TikTok Creator Rewards は「1分以上」の動画のみ対象。60未満にすると収益対象外になる。
  min_duration_sec: 62
  max_duration_sec: 90
  slides_per_video: 6
  background_color: '#0f172a'
  text_color: '#f8fafc'
  accent_color: '#38bdf8'
  tts_lang: 'ja'

publishing:
  # はてなブログ AtomPub（公式API）。note には公式の投稿APIが無く、
  # 非公式APIはログインCookieが要るので採用しない（src/publishers/hatena.py）。
  # 1本目を確認したら false にする。以後は /approve だけで公開される。
  hatena_draft: true
  hatena_categories: ['お金', '税金']
  hatena_timeout: 30
  # note（非公式API・ログインセッション）。オーナーが note を指定したため用意。
  # 公式APIではないので note 側の仕様変更で壊れる。
  # 2026-08-31: 下書き2本をオーナーが note の画面で確認し、書式が崩れて
  # いなかったので false にした。以後は /approve だけで本公開される。
  note_draft: false
  note_timeout: 30
  # 投稿時のプライバシー。未審査アプリは SELF_ONLY のみ許可される。
  privacy_level: 'SELF_ONLY'   # SELF_ONLY | MUTUAL_FOLLOW_FRIENDS | PUBLIC_TO_EVERYONE
  disable_comment: false
  disable_duet: false
  disable_stitch: false
  # ハッシュタグ（動画説明に付与）
  hashtags: ['#お金の話', '#税金', '#確定申告', '#節税', '#解説']

approval:
  # 承認 Issue のラベル。ワークフローの起動条件に使う。
  label: 'approval-queue'
  # 週次レポートのラベル。承認ワークフローを誤発火させないよう別にする。
  report_label: 'weekly-report'
  # 設計レビューのラベル。これも承認ワークフローとは別にする。
  review_label: 'design-review'
  # safety_flags 付きの案件を `/approve all` の対象から外す（安全装置）
  exclude_flagged_from_bulk: true
  # 1 通の Issue に載せる最大件数（通勤中に読める量に抑える）
  max_items_per_issue: 5
