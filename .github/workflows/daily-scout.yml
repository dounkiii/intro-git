# 探索レイヤ: 発掘 → 裏取り → 採点 → 日次レポート Issue。
# 制作ジョブ (daily-generate.yml) より 1 時間早く走らせ、通勤前に判断できるようにする。
#
# 人間の作業は Issue にコメント1行:
#   /adopt <id>  → 採用。翌朝からそのテーマでコンテンツが生成される
#   /drop  <id>  → 捨てる。以後再提示されない
name: daily-scout

on:
  schedule:
    # 20:00 UTC = 翌 05:00 JST（制作ジョブの1時間前）
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: 'サンプル候補で動かす（true/false）'
        required: false
        default: 'false'

permissions:
  contents: write   # 探索結果 (data/scout) をコミットするため
  issues: write     # レポート Issue を作るため

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 発掘・裏取り・採点してレポート Issue を作成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 探索レイヤは AFF_* から換金経路を実測する（Scorer._has_affiliate_route）。
          # 渡し忘れると monetization_observed が常に False になり、
          # すべての候補が「案件未設定」判定になって business スコアが上がらない。
          AFF_HUB_URL: ${{ secrets.AFF_HUB_URL }}
          AFF_PRODUCT_URL: ${{ secrets.AFF_PRODUCT_URL }}
          AFF_ACCOUNTING_SOFT: ${{ secrets.AFF_ACCOUNTING_SOFT }}
          AFF_TAX_ADVISOR: ${{ secrets.AFF_TAX_ADVISOR }}
          AFF_FURUSATO: ${{ secrets.AFF_FURUSATO }}
          AFF_SECURITIES: ${{ secrets.AFF_SECURITIES }}
          AFF_INSURANCE: ${{ secrets.AFF_INSURANCE }}
        run: |
          SAMPLE_FLAG=""
          if [ "${{ inputs.sample }}" = "true" ]; then SAMPLE_FLAG="--sample"; fi
          set -o pipefail
          python -m src.pipeline scout --open-issue $SAMPLE_FLAG 2>&1 | tee /tmp/pipeline.log

      # 失敗した回も記録して push する（if: always()）。ジョブが落ちると
      # 下のコミットステップは動かず、記録がランナーごと消えるため独立させている。
      # api.github.com が塞がれた環境からは Actions のログが読めないので、
      # 昨夜の実行を git だけで追えるようにするのが目的。
      # コミットするのは data/ops/ だけ。失敗時の中途半端な状態は残さない。
      - name: 実行結果を記録
        if: always()
        run: |
          python -m src.pipeline oplog \
            --workflow daily-scout \
            --status '${{ job.status }}' \
            --log /tmp/pipeline.log \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/ops/
          if git diff --cached --quiet; then
            echo "記録に変更なし"
            exit 0
          fi
          git commit -m "chore: daily-scout の実行結果を記録 (${{ job.status }})"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push

      - name: 探索結果をコミット
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore: 探索結果を更新 ($(date -u +%Y-%m-%d))"
          # 先にコミットしてから rebase する。他のワークフローや手元からの push と
          # 競合したときに、pull を省くと push が拒否されて状態が失われる。
          # `|| true` で握り潰さないのは、衝突したまま push すると状態が壊れるため。
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push
