# 毎朝の生成ジョブ。
# 収集 → Claude が台本と記事を生成 → 承認 Issue を作成し、状態をコミットする。
# 人間の作業はこの Issue にコメントするだけ（docs/PHONE_OPS.md）。
name: daily-generate

on:
  schedule:
    # 21:00 UTC = 翌 06:00 JST。止めたいときはこの schedule をコメントアウトする。
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '生成する件数'
        required: false
        default: '5'
      sample:
        description: 'サンプルデータで動かす（true/false）'
        required: false
        default: 'false'

permissions:
  contents: write   # 承認キューの状態をコミットするため
  issues: write     # 承認 Issue を作るため

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ffmpeg と日本語フォントをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 生成して承認 Issue を作成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AFF_HUB_URL: ${{ secrets.AFF_HUB_URL }}
          AFF_PRODUCT_URL: ${{ secrets.AFF_PRODUCT_URL }}
          AFF_ACCOUNTING_SOFT: ${{ secrets.AFF_ACCOUNTING_SOFT }}
          AFF_TAX_ADVISOR: ${{ secrets.AFF_TAX_ADVISOR }}
          AFF_FURUSATO: ${{ secrets.AFF_FURUSATO }}
          AFF_SECURITIES: ${{ secrets.AFF_SECURITIES }}
          AFF_INSURANCE: ${{ secrets.AFF_INSURANCE }}
        run: |
          SAMPLE_FLAG=""
          if [ "${{ inputs.sample }}" = "true" ]; then SAMPLE_FLAG="--sample"; fi
          set -o pipefail
          python -m src.pipeline run \ 2>&1 | tee /tmp/pipeline.log
            --limit "${{ inputs.limit || '5' }}" \
            --open-issue $SAMPLE_FLAG

      # 失敗した回も記録して push する（if: always()）。ジョブが落ちると
      # 下のコミットステップは動かず、記録がランナーごと消えるため独立させている。
      # api.github.com が塞がれた環境からは Actions のログが読めないので、
      # 昨夜の実行を git だけで追えるようにするのが目的。
      # コミットするのは data/ops/ だけ。失敗時の中途半端な状態は残さない。
      - name: 実行結果を記録
        if: always()
        run: |
          python -m src.pipeline oplog \
            --workflow daily-generate \
            --status '${{ job.status }}' \
            --log /tmp/pipeline.log \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/ops/
          if git diff --cached --quiet; then
            echo "記録に変更なし"
            exit 0
          fi
          git commit -m "chore: daily-generate の実行結果を記録 (${{ job.status }})"
          git pull --rebase origin "${{ github.ref_name }}"
          git push

      - name: 承認キューの状態をコミット
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore: 承認キューを更新 ($(date -u +%Y-%m-%d))"
          # 先にコミットしてから rebase する。他のワークフローや手元からの push と
          # 競合したときに、pull を省くと push が拒否されて状態が失われる。
          # `|| true` で握り潰さないのは、衝突したまま push すると状態が壊れるため。
          git pull --rebase origin "${{ github.ref_name }}"
          git push
