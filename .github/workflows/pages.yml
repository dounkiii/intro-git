# 承認済みの記事を GitHub Pages に公開する。
#
# **なぜ Pages なのか。** note には公式の投稿APIが無く、キャプチャにオーナーの
# PC作業が必要で止まっていた。はてなは公式APIだがアカウント作成と Secret 登録が
# 要る。どの外部サービスもオーナーの作業なしには使えない。Pages はこの
# リポジトリの中で完結するので、一度有効にすれば以後は push だけで公開される。
#
# **承認ゲートは維持している。** サイトに出るのは人が /approve を押したものだけ
# （src/publishers/site.py の PUBLISHABLE）。pending は出さない。
name: pages

on:
  push:
    branches: [claude/mobile-automation-side-income-59tccj]
    paths:
      - 'data/review_queue/**'
      - 'src/publishers/**'
      - 'src/monetize/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 権限はジョブごとに最小で持つ。build は実行結果を push するので contents: write が
# 必要（read のままだと github-actions[bot] が 403 で弾かれ、記録ステップが落ちる。
# 初回の実行で実際に起きた）。deploy は push しないので contents は要らない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -q -r requirements.txt

      - name: サイトを書き出す
        env:
          # 記事末尾の CTA と広告表示に使う。未設定なら CTA は出ない（no_route）。
          AFF_HUB_URL: ${{ secrets.AFF_HUB_URL }}
          AFF_PRODUCT_URL: ${{ secrets.AFF_PRODUCT_URL }}
          AFF_ACCOUNTING_SOFT: ${{ secrets.AFF_ACCOUNTING_SOFT }}
          AFF_TAX_ADVISOR: ${{ secrets.AFF_TAX_ADVISOR }}
          AFF_FURUSATO: ${{ secrets.AFF_FURUSATO }}
          AFF_SECURITIES: ${{ secrets.AFF_SECURITIES }}
          AFF_INSURANCE: ${{ secrets.AFF_INSURANCE }}
        run: |
          set -o pipefail
          python -m src.pipeline site --out build/site 2>&1 | tee /tmp/pages.log

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  # 記録は build と deploy の両方を見てから行う。
  #
  # **なぜ独立したジョブなのか。** 最初は build の中で job.status を記録して
  # いたが、それだと build が成功して deploy が失敗した回が `pages: success`
  # として記録され、opreport が「異常なし」を出した（初回に実際に起きた）。
  # **公開できていないのに記録上は成功**という、一番気づけない形になる。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  record:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -q -r requirements.txt

      - name: 実行結果を記録
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          # どちらかでも success でなければ失敗として記録する。
          if [ "$BUILD" = "success" ] && [ "$DEPLOY" = "success" ]; then
            STATUS=success
          else
            STATUS=failure
          fi
          printf 'build=%s deploy=%s\n' "$BUILD" "$DEPLOY" > /tmp/pages.log
          python -m src.pipeline oplog \
            --workflow pages \
            --status "$STATUS" \
            --log /tmp/pages.log \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/ops/
          git diff --cached --quiet || {
            git commit -m "chore: pages の実行結果を記録 ($STATUS)"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push
          }
